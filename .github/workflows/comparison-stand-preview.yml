name: Comparison stand preview

on:
  pull_request:
    paths:
      - sources/**
      - comparison-stand/**
      - .github/workflows/comparison-stand-preview.yml

permissions:
  checks: write
  contents: read
  pull-requests: write

concurrency:
  group: comparison-stand-${{ github.event.number }}
  cancel-in-progress: true

jobs:
  build_and_preview:
    # A pull request from a fork cannot read the Firebase secret, so the whole
    # job is skipped instead of failing. Do not make this check required.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Restore the built variable font
        id: font-cache
        uses: actions/cache@v4
        with:
          path: vf-build
          key: vf-${{ runner.os }}-${{ hashFiles('sources/MartianGrotesk.glyphs', 'sources/build.py', 'sources/config.yaml', 'sources/requirements.txt') }}

      - uses: actions/setup-python@v5
        if: steps.font-cache.outputs.cache-hit != 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: sources/requirements.txt

      # gftools depends on pycairo, which ships no Linux wheel and is compiled
      # against the cairo headers during pip install.
      - name: Install the cairo headers
        if: steps.font-cache.outputs.cache-hit != 'true'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libcairo2-dev pkg-config

      - name: Build the variable font
        if: steps.font-cache.outputs.cache-hit != 'true'
        run: sources/build.sh --variable-only --out "$GITHUB_WORKSPACE/vf-build"

      # The pnpm version comes from "packageManager" in comparison-stand/package.json.
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: comparison-stand/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: comparison-stand/pnpm-lock.yaml

      - name: Install stand dependencies
        working-directory: comparison-stand
        run: pnpm install --frozen-lockfile

      - name: Collect the fonts to compare
        working-directory: comparison-stand
        env:
          PR_NUMBER: ${{ github.event.number }}
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
          PR_SHA: ${{ github.event.pull_request.head.sha }}
          PR_SUBJECT: ${{ github.event.pull_request.title }}
        run: ./scripts/prepare-fonts.sh --current-dir "$GITHUB_WORKSPACE/vf-build"

      - name: Build the stand
        working-directory: comparison-stand
        run: pnpm build

      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_GROTESK_COMPARISON_STAND }}
          projectId: grotesk-comparison-stand
          entryPoint: ./comparison-stand
          channelId: pr-${{ github.event.number }}
          expires: 30d
